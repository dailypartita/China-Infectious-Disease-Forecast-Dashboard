name: Dengue Truth Data

# Upstream hub-dashboard-predtimechart only writes target (truth) JSONs at the
# global max as_of (weekly), so monthly dengue truth files are never produced.
# This workflow patches them onto ptc/data after every Rebuild Data run.
on:
  workflow_run:
    workflows: [Rebuild Data]
    types: [completed]
  schedule:
    - cron: '0 17 * * 5'  # Friday 17:00 UTC, after the 14:00 UTC rebuild
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Sibling checkouts. Nesting main inside the ptc/data worktree leaves
      # an untracked main-src/ directory, so `git status` is dirty even when
      # targets/ is unchanged and the commit below fails under `bash -e`.
      - uses: actions/checkout@v4
        with:
          ref: ptc/data
          path: ptc-data
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate dengue truth JSONs
        run: python3 main-src/scripts/gen_dengue_truth.py ptc-data
      - name: Commit and push if changed
        working-directory: ptc-data
        run: |
          git add -- targets/
          if [[ -z "$(git diff --cached --name-only -- targets/)" ]]; then
            echo "no changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: patch dengue truth JSONs (monthly as_ofs)"
            git push origin ptc/data
          fi
