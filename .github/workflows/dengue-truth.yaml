name: Patch dengue truth and as-of options

# Upstream hub-dashboard-predtimechart only writes target (truth) JSONs at the
# global max as_of (weekly), so dengue truth files are never produced for other
# reference dates. It also sets available_as_ofs from forecast reference dates,
# and when a target has no forecast file falls back to min(reference_date)
# (2009-09-07). Flu and dengue then load a missing or ancient snapshot for
# "As of data" while "Current data" uses current_date. A forecast file shrinks
# that list to the forecast reference date and drops the older truth snapshots.
# Models are included only when designated or listed in initial_checked_models,
# so a flu-only or dengue-only model is missing from the picker.
#
# This workflow runs after every successful Rebuild Data: it writes dengue
# truth JSON, drops flu snapshots that disagree with the current Hub CNIC
# series, backfills target JSON for forecast weeks that would otherwise 404,
# rewrites available_as_ofs to dates that have a real target file, and keeps a
# model in models only when Hub model-metadata/<model>.yaml still exists
# (with a metadata link in that case). Models that remain only in historical
# forecast JSON are dropped. initial_checked_models is left unchanged. The
# same run writes models-by-target.json so the forecast page can list the
# models that have forecast data for the selected target. That mapping is not
# stored in predtimechart-options.json: predtimechart v3 rejects extra fields.
# workflow_dispatch runs the same patch without waiting for Rebuild Data.
on:
  workflow_run:
    workflows: [Rebuild Data]
    types: [completed]
  schedule:
    - cron: '0 17 * * 5'  # Friday 17:00 UTC, after the 14:00 UTC rebuild
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Sibling checkouts. Nesting main inside the ptc/data worktree leaves
      # an untracked main-src/ directory, so `git status` is dirty even when
      # targets/ is unchanged and the commit below fails under `bash -e`.
      - uses: actions/checkout@v4
        with:
          ref: ptc/data
          path: ptc-data
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate dengue truth JSONs
        run: python3 main-src/scripts/gen_dengue_truth.py ptc-data
      - name: Patch as-of options and model list
        run: python3 main-src/scripts/patch_predtimechart_as_ofs.py ptc-data
      - name: Commit and push if changed
        working-directory: ptc-data
        run: |
          git add -- targets/ predtimechart-options.json models-by-target.json
          if [[ -z "$(git diff --cached --name-only)" ]]; then
            echo "no changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: patch dengue truth, as-of dates, and forecast model list"
            git push origin ptc/data
          fi
