---
# Updated: 2026-11-02 — hub target data migrated to hubverse v6 standard
# (target_end_date/target/location/observation + hub-config/target-data.json),
# so target_data_file_name is dropped: the build now uses the standard
# hubdata.connect_target_data loader, which filters truth data per target.
# (The legacy custom-file path does not filter and mixed all targets' rows.)
# NOTE: "mo inc dengue cases" (rounds_idx 1, monthly) is intentionally not shown here —
# predtimechart assumes evenly-spaced weekly target_end_date and this config is rounds_idx 0.
rounds_idx: 0
reference_date_col_name: reference_date
target_date_col_name: target_end_date
horizon_col_name: horizon
initial_checked_models:
  - CNCovidHub-ensemble
  - GZNL-NextWave
  - XMU_CTModelling-FNN
  - XMU_CTModelling-LSTM
  - XMU_CTModelling-XGBoost
  - XMU_CTModelling-GRU
  - XMU_CTModelling-TCN
  - MUST-SEIRS

disclaimer: 此dashboard展示中国新冠与流感阳性率的多模型预测结果，数据来源于中国疾控中心每周急性呼吸道传染病哨点监测；登革热月度报告病例数见 Dengue 登革热 页面。
task_id_text:
  location:
    CN: China
  target:
    wk inc covid prop ili: SARS-CoV-2 ILI positivity
    wk inc flu prop ili: Influenza ILI positivity
