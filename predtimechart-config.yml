---
# Updated: 2026-11-12 — hub tasks.json holds all three targets in one round, so
# dengue appears in the target switcher. Upstream predtimechart writes truth
# only at the global max as_of, and when a target has no forecast file it sets
# available_as_ofs to min(reference_date) (2009-09-07). With a forecast file it
# keeps only that reference date. It also omits models that are neither
# designated nor listed in initial_checked_models below. Dengue truth JSON,
# the as-of lists, and those missing model names are corrected on ptc/data by
# .github/workflows/dengue-truth.yaml after Rebuild Data. New models are not
# added here, so they show up in the picker unchecked.
rounds_idx: 0
reference_date_col_name: reference_date
target_date_col_name: target_end_date
horizon_col_name: horizon
initial_checked_models:
  - CNCovidHub-ensemble
  - GZNL-NextWave
  - XMU_CTModelling-FNN
  - XMU_CTModelling-LSTM
  - XMU_CTModelling-XGBoost
  - XMU_CTModelling-GRU
  - XMU_CTModelling-TCN
  - MUST-SEIRS
  - LZU-Sentinel

disclaimer: 此dashboard展示中国新冠、流感阳性率及登革热病例数的多模型预测结果。流感阳性率来自中国国家流感中心（CNIC）全国 ILI 标本实验室阳性率；新冠来自中国疾控中心哨点监测，登革热来自中国疾控中心法定传染病月报。新冠与流感为周频目标，登革热为月频目标。
task_id_text:
  location:
    CN: China
  target:
    wk inc covid prop ili: SARS-CoV-2 ILI positivity
    wk inc flu prop ili: CNIC ILI-specimen positivity
    mo inc dengue cases: Dengue cases (monthly)
