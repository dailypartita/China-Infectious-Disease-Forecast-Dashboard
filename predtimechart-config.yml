---
# Updated: 2026-11-02 — hub tasks.json now holds all three targets in a single
# round (dengue as a separate model_tasks block with monthly reference dates),
# so dengue appears in the target switcher. Dengue truth JSONs are maintained
# by .github/workflows/dengue-truth.yaml (upstream only writes truth at the
# global max as_of, which monthly reference dates never coincide with).
rounds_idx: 0
reference_date_col_name: reference_date
target_date_col_name: target_end_date
horizon_col_name: horizon
initial_checked_models:
  - CNCovidHub-ensemble
  - GZNL-NextWave
  - XMU_CTModelling-FNN
  - XMU_CTModelling-LSTM
  - XMU_CTModelling-XGBoost
  - XMU_CTModelling-GRU
  - XMU_CTModelling-TCN
  - MUST-SEIRS

disclaimer: 此dashboard展示中国新冠、流感阳性率及登革热病例数的多模型预测结果，数据来源于中国疾控中心；新冠与流感为周频目标，登革热为月频目标。
task_id_text:
  location:
    CN: China
  target:
    wk inc covid prop ili: SARS-CoV-2 ILI positivity
    wk inc flu prop ili: Influenza ILI positivity
    mo inc dengue cases: Dengue cases (monthly)
